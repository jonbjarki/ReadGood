$kind: http-request
method: GET
url: '{{base_url}}/api/books/search'
order: 2000
description: |-
  Search for books by title and optional filters.
  
  ## Query Parameters
  - **title** (required): The book title to search for
  - **author** (optional): Filter by author name
  - **subject** (optional): Filter by subject/category
  - **page** (optional, default: 1): Page number for pagination
  - **pageSize** (optional, default: 10, max: 40): Number of results per page
  
  ## Response
  Returns a PagedResponse containing:
  - results: array of BookSearchItemDto
    - id: string
    - title: string
    - author: string (optional)
    - firstPublished: string (optional)
    - coverImageUrl: string (optional)
  - page: number
  - pageSize: number
  - total: number
queryParams:
  - key: title
    value: 'The Great Gatsby'
    description: 'Required: The book title to search for'
  - key: author
    value: ''
    description: 'Optional: Filter by author name'
    disabled: true
  - key: subject
    value: ''
    description: 'Optional: Filter by subject/category'
    disabled: true
  - key: page
    value: '1'
    description: 'Optional: Page number (default: 1)'
    disabled: true
  - key: pageSize
    value: '10'
    description: 'Optional: Results per page (default: 10, max: 40)'
    disabled: true
